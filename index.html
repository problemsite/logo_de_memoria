<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo de Memória</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a2e4d;--cy:#00c8ff;--cy2:#0096c7;--soft:#e6fbff;--soft2:#cdf4ff;--y:#ffd400;--good:#00d26a;--bad:#ff3d5a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;user-select:none;-webkit-user-select:none;background:#00a6ff}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;color:var(--ink);
  background-color:#00a6ff;
  background-image:var(--doodle),radial-gradient(circle at 10% 12%,#7dffe3 0,transparent 35%),radial-gradient(circle at 92% 88%,#6e7bff 0,transparent 38%),linear-gradient(135deg,#00e5ff 0%,#00b3ff 45%,#0a6cff 100%);
  background-size:240px 240px,100% 100%,100% 100%,100% 100%;animation:doodle 40s linear infinite}
@keyframes doodle{to{background-position:240px 240px,0 0,0 0,0 0}}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
.content{position:absolute;top:var(--vgap,0px);bottom:var(--vgap,0px);left:var(--gap,0px);right:var(--gap,0px);padding:22px}
/* mouses customizados: seta, mãozinha, texto e carregando */
body.cc,body.cc *{cursor:var(--cc)!important}
body.cc button,body.cc button *,body.cc label,body.cc label *,body.cc a,body.cc select,body.cc input[type=range],body.cc input[type=file],body.cc [data-key],body.cc [data-key] *,body.cc .slot.free,body.cc .slot.free *,body.cc .avatar-pick,body.cc .avatar-pick *,body.cc .crop-view,body.cc .crop-view *{cursor:var(--cc-hand)!important}
body.cc input[type=text],body.cc .jname{cursor:var(--cc-text)!important}
body.cc.busy,body.cc.busy *{cursor:var(--cc-wait)!important}
body:not(.cc).busy,body:not(.cc).busy *{cursor:progress!important}
body:not(.cc) .slot.free,body:not(.cc) .slot.free *,body:not(.cc) .avatar-pick,body:not(.cc) .avatar-pick *,body:not(.cc) button,body:not(.cc) button *{cursor:pointer}
body.scripted.scripted,body.scripted.scripted *{cursor:none!important}

.panel{background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink)}
.title{margin:0;font-family:'Lilita One',sans-serif;font-weight:400;text-align:center;color:var(--y);letter-spacing:2px;line-height:.9;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink)}
.title .w{color:#fff}
.btn{font-family:'Lilita One',sans-serif;font-size:30px;color:var(--ink);background:var(--good);border:4px solid var(--ink);border-radius:20px;padding:6px 40px;box-shadow:0 7px 0 var(--ink);cursor:pointer;transition:transform .08s;letter-spacing:1px}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.btn:disabled{filter:grayscale(1);opacity:.7}
.btn.ready{background:var(--y)}
.center{display:flex;align-items:center;justify-content:center}
.loading{font-family:'Lilita One',sans-serif;font-size:40px;color:#fff;text-shadow:0 4px 0 var(--ink)}
.dots::after{content:'';animation:dots 1.4s infinite steps(4)}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.05)}}

/* entrada */
.join{width:min(540px,100%);padding:26px 30px 32px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:pop .5s}
.join .title{font-size:72px;margin-top:-80px;animation:bob 3s ease-in-out infinite}
.join p{margin:0;font-weight:900;font-size:20px;color:var(--cy2);text-align:center}
.avatar-pick{position:relative;width:150px;height:150px;border-radius:50%;background:var(--soft);border:4px dashed var(--cy2);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:17px;color:var(--cy2);cursor:pointer;overflow:hidden}
.avatar-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.avatar-pick.has img{display:none}.avatar-pick.has{border:5px solid var(--ink);background-color:#fff;background-size:cover;background-position:center;background-repeat:no-repeat}.avatar-pick.has span{display:none}
.avatar-pick .edit{position:absolute;left:0;right:0;bottom:0;height:34%;background:rgba(10,46,77,.6);color:#fff;font-size:13px;font-weight:900;display:none;align-items:center;justify-content:center}
.avatar-pick.has:hover .edit{display:flex}
.crop{position:absolute;inset:0;z-index:150;background:rgba(10,46,77,.6);display:none;align-items:center;justify-content:center}
.crop.show{display:flex}
.crop-box{padding:20px 26px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .35s both}
.crop-box h3{margin:0;font-family:'Lilita One',sans-serif;font-weight:400;font-size:30px;color:var(--ink)}
.crop-view{position:relative;width:280px;height:280px;border-radius:50%;overflow:hidden;border:5px solid var(--ink);background:#e6fbff;cursor:grab;touch-action:none}
.crop-view:active{cursor:grabbing}
.crop-view img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-zoom{display:flex;align-items:center;gap:10px;font-size:22px;width:280px}
.crop-zoom input{flex:1;accent-color:var(--cy2)}
.crop .hint2{font-weight:800;font-size:14px;color:#3d7a99}
.crop .row2{display:flex;gap:12px}
.btn.sec{background:#fff}
.jname{font:inherit;font-size:24px;font-weight:900;text-align:center;width:100%;padding:6px 12px;border-radius:16px;border:4px solid var(--ink);background:var(--soft);color:var(--ink);outline:none}
.jname:focus{background:#fff9d6}
.slot .avatar-pick{width:150px;height:150px;flex:none}
.slot .btn{font-size:22px;padding:4px 22px}
.slot.open{background:#fffbe0;box-shadow:0 8px 0 var(--ink),0 0 0 6px var(--y)}
.slot.free{cursor:pointer;transition:transform .15s}
.slot.free:hover{transform:translateY(-6px) rotate(-1deg)}
.slot.free .empty{border-color:var(--cy2);color:var(--cy2);animation:wig 1.4s ease-in-out infinite}
.slot.edit{background:#fffbe0;box-shadow:0 8px 0 var(--ink),0 0 0 6px var(--y)}
.slot.edit .jname{font-size:26px}
.slot .mini{display:flex;gap:4px;align-items:center;color:#7aa3b8;font-weight:900;font-size:13px}
.slot .leave{font:inherit;font-size:13px;font-weight:900;color:#7aa3b8;background:none;border:0;cursor:pointer;text-decoration:underline}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* lobby: 2 vagas */
.lobby{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:26px}
.lobby .title{font-size:68px}
.slots{display:flex;align-items:center;justify-content:center;gap:28px;width:100%}
.slot{width:min(330px,38%);padding:20px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .45s both}
.slot .lbl{font-family:'Lilita One',sans-serif;font-size:20px;color:#fff;background:var(--cy2);border:3px solid var(--ink);border-radius:14px;padding:0 14px;box-shadow:0 3px 0 var(--ink)}
.slot img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid var(--ink);background:#fff}
.slot .empty{width:150px;height:150px;border-radius:50%;border:5px dashed #9fdcef;display:flex;align-items:center;justify-content:center;font-family:'Lilita One',sans-serif;font-size:70px;color:#9fdcef}
.slot b{font-size:28px;font-weight:900;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .st{font-weight:900;font-size:18px;color:#7aa3b8}
.slot.rd{background:#eafff2}.slot.rd .st{color:#00a854}
.slot.me{box-shadow:0 8px 0 var(--ink),0 0 0 6px var(--y)}
.vs{font-family:'Lilita One',sans-serif;font-size:64px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);animation:wig 1.2s ease-in-out infinite}
.lobby-hint{font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 var(--ink)}

/* rodada */
#boardHost{position:absolute;inset:0}
.pl-wrap{position:relative;flex:none}
.pl{position:absolute;left:0;right:0;height:146px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 10px;text-align:center;border-radius:14px;background:var(--soft);border:3px solid transparent;transition:top .7s cubic-bezier(.5,1.6,.4,1),background .4s}
.pl.lead{background:#fff4c2}
.pl.moving{z-index:2;box-shadow:0 8px 18px rgba(10,46,77,.3)}
.pl .rk{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#0a2e4d;color:#fff;font-family:'Lilita One',sans-serif;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pl.lead .rk{background:#ffc400;color:#0a2e4d}
.pl.me{border-color:var(--cy2)}
.pl img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);flex:none}
.pl .nm{width:100%;min-width:0;line-height:1.05}
.pl .nm i{font-style:normal;font-size:11px;font-weight:900;color:var(--cy2)}
.pl .nm b{display:block;font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm small{display:block;font-size:12px;font-weight:800;color:#3d7a99;white-space:nowrap}
.pl .nm small.ok{color:#00a854}
.pl .pts{position:absolute;right:8px;top:8px;font-family:'Lilita One',sans-serif;font-size:22px;background:#0a2e4d;color:#fff;border-radius:12px;padding:3px 9px;line-height:1}
.pl.lead .pts{background:#ffc400;color:#0a2e4d}
.pl .pts small{font-size:11px;margin-left:2px;opacity:.8}
.side-h{font-family:'Lilita One',sans-serif;font-size:18px;text-align:center;color:var(--cy2);letter-spacing:1px}

.overlay{position:absolute;top:var(--vgap,0px);bottom:var(--vgap,0px);left:var(--gap,0px);right:var(--gap,0px);display:none;align-items:center;justify-content:center;z-index:80}
.overlay.show{display:flex}
.overlay:has(.tapes){z-index:90;left:0;right:0;top:0;bottom:0}
.overlay.dim{background:rgba(10,46,77,.5);left:0;right:0;top:0;bottom:0}
.intro{padding:24px 40px 30px;text-align:center;animation:pop .45s both;max-width:90%}
.intro .r{font-family:'Lilita One',sans-serif;font-size:24px;color:#fff;background:var(--cy2);border:4px solid var(--ink);border-radius:16px;padding:2px 18px;display:inline-block;box-shadow:0 4px 0 var(--ink)}
.intro .s{font-weight:900;font-size:22px;color:var(--cy2);margin-top:12px;text-transform:uppercase;letter-spacing:2px}
.intro .nm{font-family:'Lilita One',sans-serif;font-size:72px;line-height:1;text-transform:uppercase;letter-spacing:2px}
.intro .chal{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:14px}
.intro .chal span{font-weight:900;font-size:26px;background:var(--y);border:4px solid var(--ink);border-radius:24px;padding:2px 20px;box-shadow:0 4px 0 var(--ink);animation:pop .4s both,wig 1.1s .5s ease-in-out infinite}
.intro .tag{font-weight:900;font-size:18px;color:#3d7a99;margin-top:12px}
.intro .n{font-family:'Lilita One',sans-serif;font-size:110px;line-height:1;color:var(--y);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);margin-top:6px;animation:pop .5s both}
.cdnum{font-family:'Lilita One',sans-serif;font-size:300px;line-height:1;color:var(--y);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 14px 0 var(--ink);animation:cdPop 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cdPop{0%{transform:scale(2.4);opacity:0}25%{transform:scale(.92);opacity:1}40%{transform:scale(1.04)}80%{transform:scale(1);opacity:1}100%{transform:scale(.7);opacity:0}}
.overlay:has(.cdnum),.overlay:has(.ttlw){z-index:100;left:0;right:0;top:0;bottom:0}
.notrans .cur{transition:none!important}
.overlay.tout .ttlw{opacity:0;transform:scale(.9);transition:opacity .25s,transform .25s}
.ttlw{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:90%}
.ttl{animation:slamBig .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slamBig{0%{transform:scale(2.6) rotate(-6deg);opacity:.0}12%{opacity:1}45%{transform:scale(.9) rotate(2deg)}68%{transform:scale(1.05) rotate(-1deg)}100%{transform:scale(1) rotate(0);opacity:1}}
#ovl.ishk .ttlw{animation:shake2 .4s}
#ovl.ishk2 .ttlw{animation:shakeBig .5s}
@keyframes shakeBig{0%,100%{transform:translate(0,0)}15%{transform:translate(-22px,12px)}30%{transform:translate(18px,-14px)}45%{transform:translate(-14px,8px)}60%{transform:translate(10px,-6px)}80%{transform:translate(-4px,3px)}}
.ttl .r{display:inline-block;font-family:'Lilita One',sans-serif;font-size:26px;color:#fff;background:var(--cy2);border:4px solid var(--ink);border-radius:16px;padding:2px 18px;box-shadow:0 4px 0 var(--ink)}
.ttl .s{font-weight:900;font-size:24px;color:#fff;margin-top:10px;text-transform:uppercase;letter-spacing:3px;text-shadow:0 3px 0 var(--ink)}
.ttl .nm{font-family:'Lilita One',sans-serif;font-size:120px;line-height:1;color:#fff;text-transform:uppercase;letter-spacing:3px;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink)}
.ttl .an{font-family:'Lilita One',sans-serif;font-size:48px;color:var(--y);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);margin-top:6px}
.chs{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:1000px}
.chs span{font-family:'Lilita One',sans-serif;font-size:40px;background:var(--y);color:var(--ink);border:5px solid var(--ink);border-radius:26px;padding:4px 26px;box-shadow:0 7px 0 var(--ink)}
.chs span.hid{visibility:hidden}
.chs span.slam{animation:slamIn .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slamIn{0%{transform:scale(3.4) rotate(-10deg);opacity:0}50%{transform:scale(.9) rotate(2deg);opacity:1}72%{transform:scale(1.06) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
.big.jaa{font-size:180px;animation:slamIn .5s cubic-bezier(.2,1.6,.4,1) both}
.big{font-family:'Lilita One',sans-serif;font-size:120px;color:var(--y);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 9px 0 var(--ink);text-align:center;line-height:1;animation:pop .45s both}
.ann{text-align:center;animation:pop .45s both;max-width:86%}
.ann .h{display:inline-block;font-family:'Lilita One',sans-serif;font-size:44px;color:var(--ink);background:var(--y);border:5px solid var(--ink);border-radius:22px;padding:2px 28px;box-shadow:0 7px 0 var(--ink);animation:wig .8s ease-in-out infinite}
.ann .t{margin-top:22px;font-family:'Lilita One',sans-serif;font-size:62px;line-height:1.05;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);animation:pop .5s .25s both}
.tapes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.tape{position:absolute;left:50%;top:50%;width:190%;height:118px;margin-left:-95%;margin-top:-59px;display:flex;align-items:center;overflow:hidden;
 background:#ffd400;border-top:16px solid transparent;border-bottom:16px solid transparent;box-sizing:border-box;
 border-image:repeating-linear-gradient(45deg,#0a0a0a 0 18px,#ffd400 18px 36px) 16;box-shadow:0 12px 0 rgba(0,0,0,.25),0 0 0 4px #0a0a0a;
 transform:rotate(var(--r)) translateY(var(--y));clip-path:var(--c0);animation:tapeIn .75s var(--d) cubic-bezier(.22,1,.36,1) forwards,tapeFloat 3s calc(var(--d) + .75s) ease-in-out infinite}
.tape .tx{display:flex;white-space:nowrap;font-family:'Lilita One',sans-serif;font-size:66px;line-height:1;color:#0a0a0a;letter-spacing:2px;animation:tapeRun 18s linear infinite;animation-direction:var(--dir)}
.tape .tx b{font-weight:400;padding:0 22px}.tape .tx i{font-style:normal;color:#ff2b4a;-webkit-text-stroke:3px #0a0a0a;padding:0 6px}
.tape.t1{--r:-13deg;--y:-265px;--d:0s;--dir:normal;--c0:inset(-20px 100% -20px 0)}
.tape.t2{--r:8deg;--y:-70px;--d:.1s;--dir:reverse;--c0:inset(-20px 0 -20px 100%)}
.tape.t3{--r:-4deg;--y:120px;--d:.22s;--dir:normal;height:160px;margin-top:-80px;--c0:inset(-20px 100% -20px 0)}
.tape.t4{--r:-8deg;--y:300px;--d:.34s;--dir:reverse;--c0:inset(-20px 0 -20px 100%)}
.tape.t3 .tx{font-size:98px}
.overlay.tout .tapes{opacity:0;transform:scale(1.06);transition:opacity .45s ease,transform .5s ease-in-out}
@keyframes tapeIn{to{clip-path:inset(-20px 0 -20px 0)}}
@keyframes tapeFloat{0%,100%{transform:rotate(var(--r)) translateY(var(--y))}50%{transform:rotate(calc(var(--r) + .6deg)) translateY(calc(var(--y) - 6px))}}
@keyframes tapeRun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.big.stop{font-size:150px;color:#ff3d5a;animation:stopIn .55s cubic-bezier(.3,1.6,.5,1) both}
.big.stop span{display:block;font-size:110px;-webkit-text-stroke:0;text-shadow:none;animation:wave .35s .5s ease-in-out 3 alternate}
@keyframes stopIn{0%{transform:scale(4) rotate(-25deg);opacity:0}60%{transform:scale(.9) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(-4deg)}}
@keyframes wave{to{transform:rotate(18deg)}}
#scr-round.nospoil #boardHost{visibility:hidden}
#scr-round.shake #boardHost{animation:shake2 .5s}
@keyframes shake2{0%,100%{transform:translate(0,0)}20%{transform:translate(-14px,6px)}40%{transform:translate(12px,-8px)}60%{transform:translate(-8px,4px)}80%{transform:translate(6px,-2px)}}
.waitbox{padding:26px 44px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .4s both}
.waitbox .ok{font-size:70px;line-height:1}
.waitbox b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:40px}
.waitbox span{font-weight:900;font-size:20px;color:#3d7a99}
.big small{display:block;font-family:'Nunito',sans-serif;font-weight:900;font-size:30px;-webkit-text-stroke:0;text-shadow:0 3px 0 var(--ink);color:#fff;margin-top:14px}
#debug{position:absolute;left:8px;bottom:6px;z-index:95;font:12px monospace;color:#0f0;background:rgba(0,0,0,.75);padding:4px 8px;border-radius:6px;display:none;pointer-events:none}

/* cortina */
.cur{position:absolute;top:0;bottom:0;width:calc(52% + 24px);z-index:95;transition:transform 1.5s cubic-bezier(.45,0,.2,1.08);pointer-events:none;transform-origin:50% 0;
  background:repeating-linear-gradient(90deg,#9e0019 0 26px,#d6002a 26px 52px,#b8001f 52px 70px,#7a0013 70px 84px);box-shadow:0 0 40px rgba(0,0,0,.5)}
.cur::after{content:'';position:absolute;left:0;right:0;top:0;height:70px;background:repeating-radial-gradient(circle at 50% -20px,#ffd400 0 22px,#e0a800 22px 30px,transparent 30px 100%);background-size:90px 70px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
#curL{left:-24px;transform:translateX(-102%)}
#curR{right:-24px;transform:translateX(102%)}
.closed #curL,.closed #curR{transform:translateX(0)}
.closed .cur{animation:folds 3.5s 1.5s ease-in-out infinite}
@keyframes folds{0%,100%{background-position:0 0}50%{background-position:6px 0}}
#suspense{position:absolute;inset:0;z-index:97;display:flex;opacity:0;visibility:hidden;transform:scale(.85);transition:opacity .5s ease,transform .6s cubic-bezier(.3,1.4,.5,1),visibility 0s .5s;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#suspense.show{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease,transform .6s cubic-bezier(.3,1.4,.5,1),visibility 0s}
#suspense .q{font-family:'Lilita One',sans-serif;font-size:66px;color:#fff;-webkit-text-stroke:4px #5a000e;paint-order:stroke fill;text-shadow:0 7px 0 #5a000e;animation:breath 1.8s ease-in-out infinite}
#suspense .q .ch{display:inline-block;animation:hop 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * .07s)}
#suspense .d{font-size:80px;animation:drum .42s ease-in-out infinite alternate}
@keyframes drum{from{transform:translateY(2px) rotate(-5deg) scale(1)}to{transform:translateY(-10px) rotate(6deg) scale(1.06)}}
@keyframes breath{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.05) rotate(1deg)}}

/* revelação */
#rv{position:absolute;inset:0;z-index:70;display:none;background-color:#00a6ff;
  background-image:var(--doodle),radial-gradient(circle at 10% 12%,#7dffe3 0,transparent 35%),radial-gradient(circle at 92% 88%,#6e7bff 0,transparent 38%),linear-gradient(135deg,#00e5ff 0%,#00b3ff 45%,#0a6cff 100%);
  background-size:240px 240px,100% 100%,100% 100%,100% 100%;animation:rvPan 30s linear infinite}
@keyframes rvPan{from{background-position:0 0,0 0,0 0,0 0}to{background-position:240px 240px,0 0,0 0,0 0}}
#rv.show{display:block}
.rv-in{position:absolute;top:var(--vgap,0px);bottom:var(--vgap,0px);left:var(--gap,0px);right:var(--gap,0px);padding:20px;display:flex;flex-direction:column;gap:18px}
.rv-head{align-self:center;display:flex;align-items:center;gap:16px;padding:8px 26px}
.rv-head span{font-family:'Lilita One',sans-serif;font-size:22px;color:#fff;background:var(--cy2);border:4px solid var(--ink);border-radius:14px;padding:2px 14px;box-shadow:0 4px 0 var(--ink)}
.rv-head b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:44px;text-transform:uppercase;letter-spacing:2px}
.rv-row{flex:1;display:grid;grid-template-columns:1fr 1.08fr 1fr;gap:18px;align-items:center;min-height:0}
.rv-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 14px 20px;position:relative}
.c1 .who,.c2 .who{align-self:flex-start;padding-right:70px}
.who{display:flex;align-items:center;gap:10px;min-height:76px;opacity:0;transform:translateY(20px) scale(.6);transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.who img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:4px solid var(--ink);background:#fff}
.who div{line-height:1}
.who small{font-family:'Lilita One',sans-serif;font-size:16px;color:var(--cy2)}
.who b{display:block;font-family:'Lilita One',sans-serif;font-weight:400;font-size:32px;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame{position:relative;width:100%;aspect-ratio:8/5;border:4px solid var(--ink);border-radius:14px;background:var(--soft);overflow:hidden;perspective:800px}
.frame .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Lilita One',sans-serif;font-size:90px;color:#9fdcef}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;opacity:0;transform:rotateY(90deg);transition:transform .6s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.score{position:absolute;right:-16px;top:-22px;width:90px;height:90px;border-radius:50%;background:var(--y);border:5px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Lilita One',sans-serif;font-size:34px;line-height:1;opacity:0;transform:scale(3) rotate(-20deg);transition:all .45s cubic-bezier(.3,1.5,.5,1);z-index:2}
.score small{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;color:#3d7a99}
.tot{font-weight:900;font-size:20px;opacity:0;transition:opacity .4s}
.real{background:linear-gradient(180deg,#fff,#fff9d6);isolation:isolate}
.real .lb{font-family:'Lilita One',sans-serif;font-size:22px;white-space:nowrap;color:var(--ink);background:var(--y);border:4px solid var(--ink);border-radius:16px;padding:0 16px;box-shadow:0 4px 0 var(--ink);min-height:0}
.real .frame{border-color:var(--y);box-shadow:0 0 0 4px var(--ink)}
.rv.p1n .c1 .who,.rv.p2n .c2 .who{opacity:1;transform:none}
.rv.p1d .c1 .frame img,.rv.p2d .c2 .frame img,.rv.rl .real .frame img{opacity:1;transform:none}
.rv.sc .score{opacity:1;transform:none}.rv.sc .tot{opacity:1}
.rv.sc .c2 .score{transition-delay:.5s}
/* cartões entram quicando, um de cada vez */
.rv-card{transform:translateY(60px) scale(.7) rotate(-4deg);opacity:0;transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .3s,filter .4s}
.rv.show .rv-card{opacity:1;transform:none}
.rv.show .c2{transition-delay:.15s}.rv.show .real{transition-delay:.3s}
.rv-card.spot{transform:scale(1.06)!important;z-index:3;box-shadow:0 0 0 6px #fff,0 0 40px 14px rgba(255,255,255,.75),0 10px 0 6px var(--ink)}
.rv-card.pop{animation:cardPop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes cardPop{0%{transform:scale(1.06)}30%{transform:scale(1.16) rotate(-2deg)}60%{transform:scale(.98) rotate(1deg)}100%{transform:scale(1.06)}}
.frame .fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
.frame .fl.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.rv-rays{position:absolute;left:50%;top:50%;width:1100px;height:1100px;margin:-550px 0 0 -550px;z-index:0;pointer-events:none;border-radius:50%;opacity:0;transform:scale(.3);transition:opacity .8s ease,transform 1s cubic-bezier(.3,1.3,.5,1);
  }
.rv-rays .rr{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,140,.55) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 65%);mask:radial-gradient(circle,#000 25%,transparent 65%);animation:raySpin 24s linear infinite}
@keyframes raySpin{to{transform:rotate(360deg)}}
.rv-rays.on{opacity:1;transform:scale(1)}
.rv-row{position:relative}.rv-row>.rv-card{z-index:1}
@keyframes spin{to{rotate:360deg}}
.fxp{position:absolute;left:0;top:0;pointer-events:none;z-index:95;font-size:30px;line-height:1;animation:fxFly var(--t,1s) cubic-bezier(.15,.7,.3,1) forwards}
.fxp.dot{width:var(--s,12px);height:var(--s,12px);border-radius:3px;background:var(--c)}
@keyframes fxFly{0%{transform:translate(-50%,-50%) scale(.3) rotate(0)}15%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rt));opacity:0}}
.fxring{position:absolute;pointer-events:none;z-index:94;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:8px solid #fff;animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(6);opacity:0}}
.score.slam{animation:slam .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes slam{0%{transform:scale(1.8) rotate(-12deg)}55%{transform:scale(.85) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
.rv-card.win{animation:winBounce 1s .2s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes winBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) scale(1.04)}}
.rv.show .rv-card.lose{filter:grayscale(1) brightness(.92);transform-origin:14% 4%;transform:rotate(4deg) translateY(8px);transition:transform 1.3s cubic-bezier(.5,1.7,.35,1),filter 1s ease}
.rv.show .c2.lose{transform-origin:86% 4%;transform:rotate(-4deg) translateY(8px)}
.rv-card .plus{position:absolute;left:50%;top:44%;font-family:'Lilita One',sans-serif;font-size:64px;color:var(--y);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);opacity:0;pointer-events:none;z-index:4}
.rv-card .plus.go{animation:plusUp 1.3s ease-out forwards}
@keyframes plusUp{0%{opacity:0;transform:translate(-50%,20px) scale(.4)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-110px) scale(1)}}
#rv.shk .rv-in{animation:shake2 .45s}
.rv-next{position:absolute;left:50%;bottom:calc(var(--vgap,0px) + 18px);transform:translate(-50%,40px) scale(.6);z-index:96;opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.rv-next.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);animation:nextPulse 1.6s 1s ease-in-out infinite}
@keyframes nextPulse{0%,100%{box-shadow:0 7px 0 var(--ink)}50%{box-shadow:0 7px 0 var(--ink),0 0 0 10px rgba(255,255,255,.35)}}
.rv-next.voted{background:#fff;animation:none}
.rv-next:active{transform:translate(-50%,4px);box-shadow:0 3px 0 var(--ink)}
.win-tag{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%) scale(0);font-family:'Lilita One',sans-serif;font-size:18px;background:var(--good);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:0 10px;white-space:nowrap;transition:transform .4s 1s cubic-bezier(.3,1.6,.5,1)}
.rv.sc .win-tag.on{transform:translateX(-50%) scale(1)}

/* full / final */
.full{padding:30px 40px;text-align:center;font-weight:900;font-size:24px}
.full .title{font-size:54px;margin-bottom:12px}
.fin{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.fin .title{font-size:76px;animation:bob 2.4s ease-in-out infinite}
.fin{height:100%;display:flex;align-items:center;justify-content:center}
.fin-sus{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:5;animation:susOut .5s 2.3s both}
.fin-sus .d{font-size:90px;animation:drum .42s ease-in-out infinite alternate}
.fin-sus .q{font-family:'Lilita One',sans-serif;font-size:70px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);animation:breath 1.8s ease-in-out infinite}
@keyframes susOut{to{opacity:0;transform:scale(1.4);visibility:hidden}}
.fin-flash{position:absolute;inset:0;background:#fff;z-index:20;pointer-events:none;opacity:0;animation:flash .9s 2.45s ease-out}
#scr-final.shk .fin-stage{animation:shake2 .5s}
.fin-stage .pts{animation:none}
.winner b .ch{display:inline-block;animation:hop 2.6s ease-in-out infinite;animation-delay:calc(3.4s + var(--i) * .09s)}
.fin-back{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:5;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
.fin-back.show{opacity:1;pointer-events:auto}
.fin-back:active{transform:translateX(-50%) translateY(4px);box-shadow:0 3px 0 var(--ink)}
.fin-stage{position:relative;width:100%;height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:30px}
.winner{grid-column:2;position:relative;display:flex;flex-direction:column;align-items:center;animation:winIn .8s 2.5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes winIn{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.winner .rays{position:absolute;left:50%;top:150px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;z-index:-1;
  background:repeating-conic-gradient(rgba(255,255,255,.35) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.winner .lbl{font-family:'Lilita One',sans-serif;font-size:30px;color:var(--ink);background:var(--y);border:5px solid var(--ink);border-radius:20px;padding:0 24px;box-shadow:0 6px 0 var(--ink);margin-bottom:-14px;z-index:2;animation:wig 1s 3.3s ease-in-out infinite}
.winner .crown{font-size:70px;line-height:1;margin-bottom:2px;z-index:3;animation:crownIn .6s 3.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes crownIn{0%{transform:translateY(-200px) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
.winner img.av{width:250px;height:250px;border-radius:50%;object-fit:cover;border:8px solid var(--y);box-shadow:0 0 0 6px var(--ink),0 12px 0 6px var(--ink),0 0 60px 20px rgba(255,212,0,.6);background:#fff}
.winner b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:58px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);margin-top:14px;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.winner .pts{font-weight:900;font-size:28px;color:var(--y);text-shadow:0 3px 0 var(--ink)}
.trophy{position:absolute;right:-120px;top:120px;font-size:150px;line-height:1;filter:drop-shadow(0 8px 0 var(--ink));animation:trophyIn 1s 3.6s cubic-bezier(.3,1.5,.5,1) both,trophyShine 1.4s 4.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes trophyIn{0%{transform:translateY(-900px) rotate(-60deg) scale(.6);opacity:0}70%{transform:translateY(20px) rotate(8deg) scale(1.1);opacity:1}100%{transform:none;opacity:1}}
@keyframes trophyShine{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.08);filter:drop-shadow(0 8px 0 var(--ink)) drop-shadow(0 0 30px #fff6a0)}}
.sparkle{position:absolute;font-size:40px;animation:spark 1.2s ease-in-out infinite;opacity:0}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2) rotate(30deg)}}
.second{grid-column:1;justify-self:end;position:relative;display:flex;flex-direction:column;align-items:center;margin-top:120px;animation:secIn .8s 4.6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes secIn{0%{transform:translateX(-500px) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.second .lbl{font-family:'Lilita One',sans-serif;font-size:22px;color:var(--ink);background:#dfe7ef;border:4px solid var(--ink);border-radius:16px;padding:0 16px;box-shadow:0 5px 0 var(--ink);margin-bottom:-10px;z-index:2}
.second img.av{width:160px;height:160px;border-radius:50%;object-fit:cover;border:6px solid #c9d3dd;box-shadow:0 0 0 5px var(--ink),0 9px 0 5px var(--ink);background:#fff}
.second b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:38px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;margin-top:84px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.second .pts{font-weight:900;font-size:22px;color:#e6f4ff;text-shadow:0 2px 0 var(--ink)}
.medal{position:absolute;left:50%;top:128px;width:110px;margin-left:-55px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;z-index:3;animation:medalIn .8s 5.3s cubic-bezier(.3,1.6,.5,1) both,swing 2s 6.1s ease-in-out infinite}
.medal .rib{display:flex;gap:6px;height:56px}
.medal .rib i{display:block;width:26px;height:100%;background:repeating-linear-gradient(180deg,#0096c7 0 10px,#00c8ff 10px 20px);border:3px solid var(--ink)}
.medal .rib i:first-child{transform:skewX(18deg)}.medal .rib i:last-child{transform:skewX(-18deg)}
.medal .coin{margin-top:-6px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#c9d3dd 45%,#8a99a8);border:5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Lilita One',sans-serif;font-size:40px;color:var(--ink);box-shadow:0 5px 0 var(--ink)}
@keyframes medalIn{0%{transform:translateY(-700px);opacity:0}100%{transform:none;opacity:1}}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
#confetti{opacity:0;animation:fadeIn .4s 2.5s both}
@keyframes fadeIn{to{opacity:1}}
#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hop .ch{display:inline-block;animation:hop 5.2s ease-in-out infinite;animation-delay:calc(var(--i) * .11s)}
@keyframes hop{0%,9%,100%{transform:translateY(0)}4%{transform:translateY(-5px)}}
</style>
</head>
<body>
<div id="stage"><div id="curL" class="cur"></div><div id="curR" class="cur"></div>
  <section id="scr-loading" class="scr on"><div class="content center"><div class="loading" id="loadingTxt">Carregando<span class="dots"></span></div></div></section>


  <section id="scr-full" class="scr">
    <div class="content center"><div class="panel full"><h1 class="title">PARTIDA EM ANDAMENTO</h1>Os 2 lugares já estão ocupados 😅</div></div>
  </section>

  <section id="scr-lobby" class="scr">
    <div class="content lobby">
      <h1 class="title hop">LOGO <span class="w">DE</span> MEMÓRIA</h1>
      <div class="slots" id="slots"></div>
      <button id="readyBtn" class="btn">ESTOU PRONTO!</button>
      <div class="lobby-hint" id="lobbyHint"></div>
    </div>
  </section>

  <div id="crop" class="crop"><div class="panel crop-box">
    <h3>AJUSTE SUA FOTO</h3>
    <div class="crop-view" id="cropView"><img id="cropImg" alt=""></div>
    <div class="crop-zoom">🔍<input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1">➕</div>
    <div class="hint2">Arraste para mover · use a barra ou a rodinha do mouse para dar zoom</div>
    <div class="row2"><button class="btn sec" id="cropCancel">Cancelar</button><button class="btn" id="cropOk">USAR FOTO</button></div>
  </div></div>

  <section id="scr-round" class="scr">
    <div id="boardHost"></div>
    <div id="rv" class="rv"><div class="rv-in">
      <div class="panel rv-head"><span id="rvRound"></span><b id="rvName"></b></div>
      <div class="rv-row"><div class="rv-rays"><div class="rr"></div></div>
        <div class="panel rv-card c1"><div class="who"><img alt=""><div><small>JOGADOR 1</small><b></b></div></div><div class="frame"><div class="q">?</div><img alt=""><div class="fl"></div></div><div class="score"></div><div class="tot"></div><div class="win-tag">VENCEU A RODADA!</div><div class="plus"></div></div>
        <div class="panel rv-card real"><div class="lb">✨ LOGO DE VERDADE ✨</div><div class="frame"><div class="q">?</div><img alt=""><div class="fl"></div></div></div>
        <div class="panel rv-card c2"><div class="who"><img alt=""><div><small>JOGADOR 2</small><b></b></div></div><div class="frame"><div class="q">?</div><img alt=""><div class="fl"></div></div><div class="score"></div><div class="tot"></div><div class="win-tag">VENCEU A RODADA!</div><div class="plus"></div></div>
      </div>
    </div></div>
    <button class="btn rv-next" id="rvNext">PRÓXIMO DESENHO ▶</button>
    <div id="suspense"><div class="d">🥁</div><div class="q" id="susTxt"></div></div>
    <div id="ovl" class="overlay"></div>
    <div id="debug"></div>
  </section>

  <section id="scr-final" class="scr">
    <div id="confetti"></div>
    <div class="content fin" id="fin"></div>
    <button class="btn fin-back" id="finBack">↩ VOLTAR AO LOBBY</button>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="engine.js"></script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const stage = $('#stage');

/* ---------- linha do tempo da revelação (ms depois do fim do cronômetro) ---------- */
// tempos da contagem (editáveis no ADM)
const cfgN = (k, d, lo, hi) => { const v = +config[k]; return Math.max(lo, Math.min(hi, isFinite(v) && config[k] !== '' && config[k] != null ? v : d)); };
const cdMs = () => { const x = cfgN('cdSecs', 0, 0, 10); return x ? x * 1000 + 500 : 0; }; // contagem extra do lobby (0 = sem)
const introMs = l => Engine.introPlan(l, config).total;
const setCurtain = v => { if (stage.classList.contains('closed') !== !!v) stage.classList.toggle('closed', !!v); };          // abertura da rodada (cortina + contagem + desafios)
const txt = (k, d) => (config[k] == null ? d : String(config[k]));
const fill = (str, o) => String(str).replace(/\{(\w+)\}/g, (m, k) => o[k] != null ? o[k] : m);
const T = { CLOSE: 2000, CLOSED: 3100, OPEN: 5900, P1N: 6900, P1D: 8400, P2N: 10400, P2D: 11900, REAL: 13900, SCORE: 15900, END: 18900 };

/* ---------- tela cheia, centralizada ---------- */
const DOODLE = "url(\"data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M30 60 l40 -40 l12 12 l-40 40 l-16 4 z"/><path d="M150 40 l8 18 l20 2 l-15 13 l5 20 l-18 -11 l-18 11 l5 -20 l-15 -13 l20 -2 z"/>' +
  '<circle cx="190" cy="170" r="22"/><path d="M30 170 q20 -30 40 0 t40 0"/><path d="M110 120 h30 M125 105 v30"/><rect x="60" y="200" width="30" height="24" rx="6"/></svg>') + "\")";
stage.style.setProperty('--doodle', DOODLE);
Engine.applyCursorVars(document.body);

let SCALE = 1, SW = 1280, SH = 720;

const CROP = { img: null, z: 1, cx: 0, cy: 0, V: 280, resolve: null };
function openCrop(file, onReady) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      if (onReady) onReady();
      CROP.img = img; CROP.z = 1; CROP.cx = 0; CROP.cy = 0; CROP.resolve = res;
      $('#cropImg').src = img.src; $('#cropZoom').value = 1; drawCrop();

}
function cropScale() { const i = CROP.img; return CROP.V / Math.min(i.width, i.height) * CROP.z; }
function drawCrop() {
  const i = CROP.img; if (!i) return;
  const k = cropScale(), w = i.width * k, h = i.height * k;
  const mx = Math.max(0, (w - CROP.V) / 2), my = Math.max(0, (h - CROP.V) / 2);
  CROP.cx = Engine.clamp(CROP.cx, -mx, mx); CROP.cy = Engine.clamp(CROP.cy, -my, my);

  im.style.width = w + 'px'; im.style.height = h + 'px';
  im.style.left = (CROP.V / 2 - w / 2 + CROP.cx) + 'px'; im.style.top = (CROP.V / 2 - h / 2 + CROP.cy) + 'px';
}
function closeCrop(val) {

  const r = CROP.resolve; CROP.resolve = null; CROP.img = null; if (r) r(val);
}
(() => {
  const view = $('#cropView'); let drag = null;

  const end = () => { drag = null; };
  view.addEventListener('pointerup', end); view.addEventListener('pointercancel', end);
  view.addEventListener('wheel', e => { e.preventDefault(); CROP.z = Engine.clamp(CROP.z * (e.deltaY < 0 ? 1.08 : 1 / 1.08), 1, 4); $('#cropZoom').value = CROP.z; drawCrop(); }, { passive: false });

  $('#cropOk').addEventListener('click', () => {
    const i = CROP.img; if (!i) return closeCrop(null);
    const k = cropScale(), left = CROP.V / 2 - i.width * k / 2 + CROP.cx, top = CROP.V / 2 - i.height * k / 2 + CROP.cy;
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 256, 256);
    x.drawImage(i, -left / k, -top / k, CROP.V / k, CROP.V / k, 0, 0, 256, 256);

  });
})();
function fileToAvatar(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 192;
      const s = Math.min(img.width, img.height);

let joining = false, nameTimer = null;
// clicar na vaga livre já entra (nome e foto podem ser editados depois, no próprio cartão)
async function doJoin(n) {
  if (!uid || joining || seatList()[n - 1] || slotOf(uid)) return;
  joining = true; busy(true);
  try {
    const res = await ref('seats/' + n).transaction(cur => { if (cur && cur !== uid && players[cur] && players[cur].name) return; return uid; });
    if (res && res.committed === false) { lobbyKey = ''; render(); return; }
    await ref('players/' + uid).set({ name: 'Jogador ' + n, photo: '', slot: n, joinedAt: firebase.database.ServerValue.TIMESTAMP, online: true, ready: false });
    lobbyKey = '';
  } finally { joining = false; busy(false); }
}

  ref('players/' + uid + '/online').onDisconnect().cancel(); onlineSet = false;
  ref('players/' + uid).remove(); ref('seats/' + n).remove();

let curScr = 'loading';

  if (curScr !== id) { $$('.scr').forEach(s => s.classList.toggle('on', s.id === 'scr-' + id)); curScr = id; }
  document.body.classList.toggle('busy', busyN > 0 || id === 'loading');

function holdLobby() {
  const r = game.round | 0, P = Engine.introPlan(roundLogo(r), config), S0 = (+game.startAt || 0) - P.total;
  return now() < S0 + P.close;

function render() {
  if (!loaded.config || !loaded.game || !loaded.players || !loaded.logos || !uid) { show('loading'); return; }
  const s = game.state || 'lobby';
  if (!me || !slotOf(uid)) { // ainda não escolheu vaga: mostra o lobby com as 2 vagas
    leaveRound();

let startGuard = 0, startTimer = null;
function maybeStart() {
  // espera um pouquinho e confere de novo (ao voltar do ADM o "pronto" pode chegar depois do estado do jogo)
  if (startTimer) return;
  startTimer = setTimeout(() => { startTimer = null; if (Date.now() < startGuard) { setTimeout(maybeStart, startGuard - Date.now()); return; } if ((game.state || 'lobby') === 'lobby' && slotOf(uid)) doStart(); }, 400);
}
function doStart() {
  const sl = slots(), need = config.testMode ? 1 : 2;
  if (sl.length < need || !sl.every(p => p.ready && p.online) || !(config.rounds || []).length) return;
  if (sl[0].uid !== uid) return; // quem começa é o jogador 1
  const ch = Engine.challengeOf(roundLogo(0)), t = now();
  ref('game').transaction(g => {
    if (g && g.state && g.state !== 'lobby') return;
    const st = t + cdMs() + introMs(roundLogo(0));
    const g0 = { state: 'round', round: 0, startAt: st, endAt: st + (ch.time || +config.drawTime || 60) * 1000 };
    if (cdMs()) g0.cdAt = t;

}

  at('p2d', T.P2D, () => { fxFlash(c2); fxPop(c2); fxShake(); fxBurst(c2.querySelector('.frame'), { n: 26, emo: ['✨', '⭐'] }); });
  at('real', T.REAL, () => { fxFlash(rl); fxPop(rl); fxShake(); fxBurst(rl.querySelector('.frame'), { n: 40, emo: ['✨', '🌟', '⭐'], dist: 380 }); });
  const r = G.r, s1 = scoreOf(r, 1), s2 = scoreOf(r, 2);
  const scoreFx = (n, c, sc) => {
    const el = c.querySelector('.score'); el.classList.remove('slam'); void el.offsetWidth; el.classList.add('slam');
    countUp(el, sc, 650, fmtScore);
    const pl = c.querySelector('.plus'); pl.textContent = '+' + fmtScore(sc); pl.classList.remove('go'); void pl.offsetWidth; pl.classList.add('go');
    fxBurst(el, { n: 14, dist: 150 }); fxShake();
  };
  at('s1', T.SCORE, () => scoreFx(1, c1, s1));
  at('s2', T.SCORE + 500, () => scoreFx(2, c2, s2));
  at('win', T.SCORE + 1300, () => {
    const wn = roundWinner(r), w = wn === 1 ? c1 : c2, l = wn === 1 ? c2 : c1;
    const ry = $('.rv-rays'), tgt = w || rl, rb = $('.rv-row').getBoundingClientRect(), cb = tgt.getBoundingClientRect();
    ry.style.left = ((cb.left + cb.width / 2 - rb.left) / SCALE) + 'px'; ry.style.top = ((cb.top + cb.height / 2 - rb.top) / SCALE) + 'px'; ry.classList.add('on');
    l.classList.add('lose');
    if (e > T.SCORE + 2800) return;
    if (w) { w.classList.add('win'); fxBurst(w, { n: 50, emo: ['🎉', '⭐', '✨'], dist: 420, fall: true }); }
  });
}
function advance(r, endAt) {
  const nR = (config.rounds || []).length;
  ref('game').transaction(g => {
    if (!g || g.state !== 'round' || (g.round | 0) !== r || +g.endAt !== endAt) return;
    if (r + 1 >= nR) return { state: 'final', round: r };
    const ch = Engine.challengeOf(roundLogo(r + 1)), st = now() + introMs(roundLogo(r + 1));
    return { state: 'round', round: r + 1, startAt: st, endAt: st + (ch.time || +config.drawTime || 60) * 1000 };
  });
}
const origCache = {};
function realImg(l, id) {
  if (!l) return '';
  if (l.image) return l.image;
  const k = id + ':' + (l.updatedAt || 0);
  if (!origCache[k]) { const v = Engine.versionsOf(l)[0]; origCache[k] = v ? Engine.renderToDataURL(v, 800, 500, 0.9) : ''; }
  return origCache[k];
}
function buildReveal() {
  const r = G.r, id = (config.rounds || [])[r], l = logos[id], sl = seatList();
  $('#rvRound').textContent = `RODADA ${r + 1}`;
  $('#rvName').textContent = l ? l.name : '';
  [1, 2].forEach(n => {
    const p = sl[n - 1] || { name: '—' }, c = $('.c' + n);
    c.querySelector('.who img').src = avatar(p);
    c.querySelector('.who b').textContent = p.name;
    c.querySelector('.score').innerHTML = `${fmtScore(scoreOf(r, n))}<small>de 10</small>`;
    c.querySelector('.tot').textContent = `Total: ${fmtScore(totalUpTo(n, r))}`;
    const s1 = scoreOf(r, 1), s2 = scoreOf(r, 2);
    c.querySelector('.win-tag').classList.toggle('on', roundWinner(r) === n);
  });
  const im = $('.real .frame img'); const src = realImg(l, id); if (src) im.src = src;
  document.querySelectorAll('.rv-card').forEach(c => c.classList.remove('win', 'lose', 'spot', 'pop'));
  $('.rv-rays').classList.remove('on');
  if (now() - (+game.endAt || 0) < T.SCORE) [1, 2].forEach(n => { $('.c' + n + ' .score').innerHTML = `${fmtScore(0)}<small>de 10</small>`; });
  G.fx = {};
  fillReveal();
}
function fillReveal() {
  if (!G || !G.rvBuilt) return;
  const dr = drawings[G.r] || {}, sl = seatList();
  [1, 2].forEach(n => {
    const p = sl[n - 1], img = $('.c' + n + ' .frame img'), src = p ? dr[p.uid] : '';
    if (src && img.getAttribute('src') !== src) img.src = src;
  });
}

// Mover o mouse = avançar no roteiro. Cliques não fazem nada.
let lastMouse = null;
addEventListener('mousemove', e => { lastMouse = { x: e.clientX / SCALE, y: e.clientY / SCALE }; }, true);
addEventListener('mousemove', e => {
  if (!G || !G.scripted || curScr !== 'round' || G.finished) return;
  const dx = (e.movementX || 0) / SCALE, dy = (e.movementY || 0) / SCALE;
  const t = now();
  const drawing = t >= (+game.startAt || 0) && t < (+game.endAt || 0);
  if (G.runner && !G.runner.done && drawing && !config.needMove) {
    // mouse sozinho: o movimento do mouse de verdade é ignorado
  } else if (G.runner && !G.runner.done && drawing) {
    const mv = Math.hypot(dx, dy) * (+config.speed || 0.6);
    G.budget = G.runner.unit === 'ms' ? Math.min(G.budget + mv * 2, 1500) : Math.min(G.budget + mv, 600);
  } else if (t < (+game.startAt || 0) && G.runner && G.runner.target) {
    // contagem: o mouse fake está indo sozinho até o ponto de partida
  } else {
    const p = G.runner ? G.runner.pos() : G.cur;
    const nx = Engine.clamp(p.x + dx, 2, SW - 2), ny = Engine.clamp(p.y + dy, 2, SH - 2);
    if (G.runner) G.runner.setPos(nx, ny); else { G.cur = { x: nx, y: ny }; board.setCursor(nx, ny); }
  }
});
addEventListener('contextmenu', e => { if (G && G.scripted) e.preventDefault(); });

/* ---------- final ---------- */
let lastFinal = '';
function renderFinal() {
  const r = game.round | 0, sl = seatList();
  const list = sl.map((p, i) => p && Object.assign({ total: totalUpTo(i + 1, r) }, p)).filter(Boolean).sort((a, b) => b.total - a.total);
  const key = list.map(p => p.uid + p.total).join(',');
  if (key === lastFinal) return; lastFinal = key;
  const w = list[0], s2 = list[1];
  const sparks = [[-160, 40], [150, 10], [-130, 300], [170, 280], [0, -60]].map(([x, y], i) => `<span class="sparkle" style="left:calc(50% + ${x}px);top:${y}px;animation-delay:${3.6 + i * .25}s">✨</span>`).join('');
  $('#fin').innerHTML = `<div class="fin-sus"><div class="d">🥁</div><div class="q">E o grande campeão é…</div></div>
    <div class="fin-stage">
      ${s2 ? `<div class="second"><div class="lbl">2º LUGAR</div><img class="av" src="${avatar(s2)}" alt=""><div class="medal"><div class="rib"><i></i><i></i></div><div class="coin">2</div></div><b>${esc(s2.name)}</b><div class="pts">${fmtScore(s2.total)} pts</div></div>` : ''}
      ${w ? `<div class="winner"><div class="rays"></div>${sparks}<div class="crown">👑</div><div class="lbl">🏆 CAMPEÃO 🏆</div><img class="av" src="${avatar(w)}" alt=""><div class="trophy">🏆</div><b>${esc(w.name)}</b><div class="pts">${fmtScore(w.total)} pts</div></div>` : ''}
    </div>`;
  const cols = ['#ffd400', '#00e5ff', '#ffffff', '#7dffe3', '#ff7a00', '#ff4fd8', '#00d26a'];
  let c = ''; for (let i = 0; i < 90; i++) c += `<i style="left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-duration:${3 + Math.random() * 4}s;animation-delay:${-Math.random() * 6}s"></i>`;
  $('#confetti').innerHTML = c;
  document.querySelectorAll('#scr-final .fin-flash').forEach(x => x.remove());
  $('#scr-final').insertAdjacentHTML('beforeend', '<div class="fin-flash"></div>');
  // nome do campeão com as letras pulando
  const wb = $('#fin .winner b'); if (wb) { const t = wb.textContent; wb.innerHTML = [...t].map((ch, i) => ch === ' ' ? ' ' : `<span class="ch" style="--i:${i}">${esc(ch)}</span>`).join(''); }
  // efeitos com tempo
  (renderFinal.tm || []).forEach(clearTimeout); clearInterval(renderFinal.iv);
  const host = $('#scr-final'), T2 = (ms, fn) => renderFinal.tm.push(setTimeout(() => { if (curScr === 'final') fn(); }, ms));
  renderFinal.tm = [];
  const shk = () => { host.classList.remove('shk'); void host.offsetWidth; host.classList.add('shk'); };
  const ptsUp = (sel, to) => { const el = $(sel); if (!el) return; el.innerHTML = '<span>0,0</span> pts'; const t0 = performance.now(); const st = () => { const k = Math.min(1, (performance.now() - t0) / 1400), v = to * (1 - Math.pow(1 - k, 3)); el.firstChild.textContent = fmtScore(v); if (k < 1) requestAnimationFrame(st); }; st(); };
  if (w) { $('#fin .winner .pts').innerHTML = '<span>0,0</span> pts'; T2(2500, () => { shk(); fxBurst($('#fin .winner img.av'), { host, n: 60, emo: ['🎉', '✨', '⭐'], dist: 520 }); ptsUp('#fin .winner .pts', w.total); }); }
  T2(4500, () => { const tr = $('#fin .trophy'); if (tr) { shk(); fxBurst(tr, { host, n: 30, emo: ['✨', '🌟'], dist: 260 }); } });
  if (s2) { $('#fin .second .pts').innerHTML = '<span>0,0</span> pts'; T2(5300, () => { fxBurst($('#fin .second img.av'), { host, n: 24, emo: ['⭐'], dist: 220 }); ptsUp('#fin .second .pts', s2.total); }); }
  T2(6000, () => { renderFinal.iv = setInterval(() => { if (curScr !== 'final') { clearInterval(renderFinal.iv); return; } const d = document.createElement('div'); d.style.cssText = `position:absolute;left:${10 + Math.random() * 80}%;top:${8 + Math.random() * 40}%;width:2px;height:2px`; host.appendChild(d); fxBurst(d, { host, n: 26, dist: 200 }); setTimeout(() => d.remove(), 100); }, 1300); });
  // o botão de voltar aparece depois da animação do campeão
  $('#finBack').classList.remove('show'); clearTimeout(renderFinal.t);
  renderFinal.t = setTimeout(() => $('#finBack').classList.add('show'), 7000);
}
// volta os dois ao lobby (mesmo "cancelar tudo" do ADM: mantém jogadores e vagas)
$('#finBack').addEventListener('click', () => {
  if (game.state !== 'final') return;
  const upd = { game: { state: 'lobby', resetAt: now() }, drawings: null, live: null };
  Object.keys(players).forEach(u => upd['players/' + u + '/ready'] = false);
  ref().update(upd);
});
})();

(() => { let i = 0; const wrap = el => [...el.childNodes].forEach(n => { if (n.nodeType === 3) { const f = document.createDocumentFragment(); [...n.textContent].forEach(c => { if (c === ' ') { f.appendChild(document.createTextNode(' ')); return; } const sp = document.createElement('span'); sp.className = 'ch'; sp.style.setProperty('--i', i++); sp.textContent = c; f.appendChild(sp); }); n.replaceWith(f); } else if (n.nodeType === 1) wrap(n); }); document.querySelectorAll('.title.hop').forEach(wrap); })();
